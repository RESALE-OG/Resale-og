<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESALE OG — Supabase Ready</title>
<style>
:root{--bg:#070a10;--card:#0d1420;--line:#1d3347;--cyan:#35e6ff;--text:#eef7ff;--muted:#8fa8ba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102338,#070a10 55%);color:var(--text);font:16px system-ui,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;border-bottom:1px solid var(--line);background:#070a10dd;position:sticky;top:0}
.logo{font-weight:900;letter-spacing:2px}.logo span{color:var(--cyan)}
main{max-width:1100px;margin:auto;padding:55px 6%}.hero{padding:35px 0 25px}.hero h1{font-size:clamp(42px,8vw,76px);margin:0}.hero p{color:var(--muted);max-width:650px;line-height:1.7}
button,input{font:inherit}button{border:1px solid var(--cyan);background:#0b2530;color:#fff;padding:11px 16px;border-radius:12px;cursor:pointer}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#09111b;color:#fff}
.toolbar{display:flex;gap:10px;margin:25px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(180deg,#101b29,#0b111b);border:1px solid var(--line);border-radius:18px;padding:18px}.price{color:var(--cyan);font-size:20px;font-weight:800}.muted{color:var(--muted)}
#status{margin:14px 0;color:var(--muted)}
</style>
</head>
<body>
<nav><div class="logo">RESALE <span>OG</span></div><button id="authBtn">Sign In</button></nav>
<main>
<section class="hero"><h1>Buy Smart.<br><span style="color:#35e6ff">Resale Again.</span></h1><p>A futuristic resale marketplace foundation connected to Supabase. Sign in, list products and build your marketplace from one place.</p></section>
<div class="toolbar"><input id="search" placeholder="Search products..."><button onclick="loadProducts()">Search</button></div>
<div id="status">Checking Supabase connection…</div><section id="products" class="grid"></section>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg = window.RESALE_OG_CONFIG || {};
const url = cfg.supabaseUrl;
const key = cfg.supabasePublishableKey;
const status = document.querySelector("#status");
let supabase = null;

if (!url || !key || url.includes("YOUR-PROJECT")) {
  status.textContent = "Supabase connection pending — add your project URL and publishable key in public/config.js.";
} else {
  supabase = createClient(url,key);
  status.textContent = "Supabase client loaded.";
}

async function loadProducts(){
  const box=document.querySelector("#products");
  if(!supabase){box.innerHTML='<div class="card">Connect Supabase first.</div>';return;}
  const q=document.querySelector("#search").value.trim();
  let query=supabase.from("products").select("*").eq("status","active").order("created_at",{ascending:false});
  if(q) query=query.or(`title.ilike.%${q}%,description.ilike.%${q}%,category.ilike.%${q}%`);
  const {data,error}=await query;
  if(error){status.textContent=error.message;return;}
  box.innerHTML=(data||[]).map(p=>`<article class="card"><h3>${escapeHtml(p.title)}</h3><p class="muted">${escapeHtml(p.category)} · ${escapeHtml(p.condition)}</p><p>${escapeHtml(p.description||"")}</p><div class="price">₹${Number(p.price).toLocaleString("en-IN")}</div></article>`).join("")||'<div class="card">No products yet.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
document.querySelector("#authBtn").onclick=async()=>{
  if(!supabase){alert("Supabase connection is not configured yet.");return;}
  const email=prompt("Email");
  if(!email)return;
  const password=prompt("Password (6+ characters)");
  if(!password)return;
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){alert(error.message);return;}
  document.querySelector("#authBtn").textContent="Account";
};
window.loadProducts=loadProducts;
loadProducts();
</script>
</body>
</html>
