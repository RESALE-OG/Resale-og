*{box-sizing:border-box}
body{

footer{

.drawer,

.shade{

.panel{

.input{

.full{

    grid-template-columns:repeat(2,1fr);

<div id="toast" class="toast"></div>


<script>

const demoProducts = [

 {
  id:"demo1",
  name:"Premium Hoodie",
  price:899,
  category:"Fashion"
 },

 {
  id:"demo2",
  name:"Wireless Headphones",
  price:1299,
  category:"Electronics"
 },

 {
  id:"demo3",
  name:"Classic Sneakers",
  price:1599,
  category:"Shoes"
 },

 {
  id:"demo4",
  name:"Smart Watch",
  price:1799,
  category:"Accessories"
 },

 {
  id:"demo5",
  name:"Denim Jacket",
  price:999,
  category:"Fashion"
 },

 {
  id:"demo6",
  name:"Bluetooth Speaker",
  price:799,
  category:"Electronics"
 }

];


let products=[...demoProducts];

let cart=JSON.parse(
  localStorage.getItem("resale_cart") || "[]"
);

let currentCategory="All";

let supabaseClient=null;

let signupMode=false;


/* SUPABASE */

try{

  if(
    window.supabase &&
    window.SUPABASE_URL &&
    window.SUPABASE_ANON_KEY &&
    !String(window.SUPABASE_ANON_KEY)
      .includes("PASTE_YOUR")
  ){

    supabaseClient=
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

  }

}catch(error){

  console.log(
    "Supabase optional:",
    error
  );

}


/* HELPERS */

function money(value){

  return Number(value || 0)
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char];

    });

}


function toast(message){

  const box=
    document.getElementById("toast");

  box.textContent=message;

  box.style.display="block";

  setTimeout(function(){

    box.style.display="none";

  },1800);

}


/* PRODUCTS */

function renderProducts(){

  const list=
    currentCategory==="All"
      ? products
      : products.filter(
          p=>p.category===currentCategory
        );


  const box=
    document.getElementById("products");


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No products found.</div>';

    return;

  }


  box.innerHTML=

    list.map(function(p){

      return `

      <article class="card">

        <div class="image">

          ${
            p.image_url
            ?
            `<img src="${escapeHtml(p.image_url)}">`
            :
            "RESALE OG"
          }

        </div>

        <div class="info">

          <div class="name">
           ${escapeHtml(p.name || p.title || "Product")}
          </div>

          <div class="category">
            ${escapeHtml(p.category || "Resale")}
          </div>

          <div class="price">
            ₹${money(p.price)}
          </div>

          <div class="actions">

            <button
              onclick="addCart('${p.id}')">
              Add
            </button>

            <button
              class="buy"
              onclick="buyNow('${p.id}')">
              Buy
            </button>

          </div>

        </div>

      </article>

      `;

    }).join("");

}


function filterProducts(category,button){

  currentCategory=category;

  document
    .querySelectorAll(".filter")
    .forEach(function(btn){

      btn.classList.remove("active");

    });

  button.classList.add("active");

  renderProducts();

}


/* CART */

function findProduct(id){

  return products.find(
    p=>String(p.id)===String(id)
  );

}


function addCart(id){

  const product=findProduct(id);

  if(!product) return;

  const existing=
    cart.find(
      item=>String(item.id)===String(id)
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  saveCart();

  toast("Added to cart 🛒");

}


function buyNow(id){

  addCart(id);

  openCart();

}


function saveCart(){

  localStorage.setItem(
    "resale_cart",
    JSON.stringify(cart)
  );

  updateCart();

}


function removeCart(id){

  cart=
    cart.filter(
      item=>String(item.id)!==String(id)
    );

  saveCart();

}


function updateCart(){

  const safeCart = Array.isArray(cart)
    ? cart.map(item => ({
        ...item,
        qty: Number(item.qty) || 0,
        price: Number(item.price) || 0
      })).filter(item => item.qty > 0)
    : [];

  cart = safeCart;

  document.getElementById("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.qty, 0);

  const list = document.getElementById("cartList");

  if(cart.length){

    list.innerHTML = cart.map(function(item){

      const itemName = item.name || item.title || "Product";

      return `
        <div class="cartrow">
          <div>
            <b>${escapeHtml(itemName)}</b>
            <br>
            <small>₹${money(item.price)} × ${item.qty}</small>
          </div>

          <button
            class="remove"
            onclick="removeCart('${item.id}')">
            Remove
          </button>
        </div>
      `;

    }).join("");

  } else {

    list.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

  }

  const total = cart.reduce(
    (sum, item) =>
      sum + (Number(item.price) || 0) * (Number(item.qty) || 0),
    0
  );

  document.getElementById("cartTotal").textContent =
    money(total);
}
  
  
function openCart(){

  document
    .getElementById("cartDrawer")
    .classList.add("open");

  updateCart();

}


function closeCart(){

  document
    .getElementById("cartDrawer")
    .classList.remove("open");

}


/* LOGIN */

function openLogin(){

  document
    .getElementById("loginModal")
    .classList.add("open");

}


function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("open");

}


function toggleSignup(){

  signupMode=!signupMode;

  document.getElementById("authTitle")
    .textContent=
      signupMode
      ? "Create account"
      : "Login";


  document.getElementById("loginButton")
    .textContent=
      signupMode
      ? "Create account"
      : "Continue";


  document.getElementById("authMsg")
    .textContent="";

}


async function login(){

  const email=
    document.getElementById("email")
      .value.trim();

  const password=
    document.getElementById("password")
      .value;


  if(!email || !password){

    document.getElementById("authMsg")
      .textContent=
        "Email and password required.";

    return;

  }


  if(!supabaseClient){

    document.getElementById("authMsg")
      .textContent=
        "Supabase connection is not ready yet.";

    return;

  }


  let result;


  if(signupMode){

    result=
      await supabaseClient.auth.signUp({
        email:email,
        password:password
      });

  }else{

    result=
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

  }


  if(result.error){

    document.getElementById("authMsg")
      .textContent=
        result.error.message;

  }else{

    document.getElementById("authMsg")
      .textContent=
        signupMode
        ?
        "Account created. Check your email if confirmation is enabled."
        :
        "Login successful.";

    if(!signupMode){

      document.getElementById("accountBtn")
        .textContent="Account";

      setTimeout(
        closeLogin,
        700
      );

    }

  }

}


/* CHECKOUT */

/* CHECKOUT */

async function checkout(){

  if(!cart.length){
    toast("Cart is empty");
    return;
  }

  if(!supabaseClient){
    openLogin();
    return;
  }

  const result =
    await supabaseClient.auth.getSession();

  const session =
    result.data.session;

  if(!session){
    openLogin();
    return;
  }

  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        (Number(item.price) || 0) *
        (Number(item.qty) || 0),
      0
    );

  document.getElementById("checkoutTotal")
    .textContent = money(total);

  document.getElementById("checkoutModal")
    .classList.add("open");
}

function closeCheckout(){

  document.getElementById("checkoutModal")
    .classList.remove("open");

}

async function placeOrder(){

  const name =
    document.getElementById("checkoutName")
      .value.trim();

  const phone =
    document.getElementById("checkoutPhone")
      .value.trim();

  const address =
    document.getElementById("checkoutAddress")
      .value.trim();

  const city =
    document.getElementById("checkoutCity")
      .value.trim();

  const pin =
    document.getElementById("checkoutPin")
      .value.trim();

  const msg =
    document.getElementById("checkoutMsg");

  if(!name || !phone || !address || !city || !pin){

    msg.textContent =
      "Please fill all details.";

    return;
  }

  if(!supabaseClient){

    msg.textContent =
      "Supabase connection is not ready.";

    return;
  }

  const sessionResult =
    await supabaseClient.auth.getSession();

  const session =
    sessionResult.data.session;

  if(!session){

    msg.textContent =
      "Please login first.";

    return;
  }

  const total =
    cart.reduce(
      (sum,item) =>
        sum +
        (Number(item.price) || 0) *
        (Number(item.qty) || 0),
      0
    );

  msg.textContent =
    "Creating order...";

  /* SAVE PENDING ORDER */

  const orderResult =
    await supabaseClient
      .from("orders")
      .insert({
        buyer_id: session.user.id,
        total_amount: total,
        status: "pending",
        customer_name: name,
        customer_phone: phone,
        address: address,
        city: city,
        pin_code: pin,
        items: cart,
        payment_method: "razorpay",
        payment_status: "pending"
      })
      .select()
      .single();

  if(orderResult.error){

    console.error(orderResult.error);

    msg.textContent =
      "Order creation failed: " +
      orderResult.error.message;

    return;
  }

  const dbOrder =
    orderResult.data;

  /* CREATE RAZORPAY ORDER */

  msg.textContent =
    "Opening Razorpay...";

  const razorpayResult =
    await supabaseClient.functions.invoke(
      "bright-handler",
      {
        body: {
          action: "create_order",
          amount: total
        }
      }
    );

  if(razorpayResult.error){

    console.error(
      razorpayResult.error
    );

    msg.textContent =
      "Unable to start payment.";

    return;
  }

  const razorpayOrder =
    razorpayResult.data;

  if(
    !razorpayOrder ||
    !razorpayOrder.order_id
  ){

    msg.textContent =
      razorpayOrder?.error ||
      "Razorpay order failed.";

    return;
  }

  /* OPEN RAZORPAY */

  const options = {

    key:
      razorpayOrder.key_id,

    amount:
      razorpayOrder.amount,

    currency:
      razorpayOrder.currency,

    name:
      "RESALE OG",

    description:
      "RESALE OG Order",

    order_id:
      razorpayOrder.order_id,

    prefill: {
      name: name,
      email:
        session.user.email || "",
      contact: phone
    },

    theme: {
      color: "#20d8ff"
    },

    handler:
      async function(response){

        msg.textContent =
          "Verifying payment...";

        const verifyResult =
          await supabaseClient
            .functions
            .invoke(
              "bright-handler",
              {
                body: {

                  action:
                    "verify_payment",

                  db_order_id:
                    dbOrder.id,

                  razorpay_order_id:
                    response.razorpay_order_id,

                  razorpay_payment_id:
                    response.razorpay_payment_id,

                  razorpay_signature:
                    response.razorpay_signature
                }
              }
            );

        if(verifyResult.error){

          console.error(
            verifyResult.error
          );

          msg.textContent =
            "Payment verification failed.";

          return;
        }

        if(
          !verifyResult.data ||
          !verifyResult.data.success
        ){

          msg.textContent =
            verifyResult.data?.error ||
            "Payment verification failed.";

          return;
        }

        /* PAYMENT SUCCESS */

        cart = [];

        localStorage.removeItem(
          "resale_cart"
        );

        updateCart();

        msg.textContent =
          "Payment successful! 🎉";

        toast(
          "Payment successful 🎉"
        );

        setTimeout(function(){

          closeCheckout();
          closeCart();

        },1200);
      },

    modal: {
      ondismiss:
        function(){

          msg.textContent =
            "Payment cancelled.";

        }
    }
  };

  const rzp =
    new Razorpay(options);

  rzp.open();
    }


/* LOAD PRODUCTS */

async function loadProducts(){

  if(!supabaseClient){

    renderProducts();

    updateCart();

    return;

  }


  try{

    const result=
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );


    if(
      !result.error &&
      result.data &&
      result.data.length
    ){

      products=result.data;

    }

  }catch(error){

    console.log(error);

  }


  renderProducts();

  updateCart();

}


/* AUTH STATE */

if(supabaseClient){

  supabaseClient.auth
    .onAuthStateChange(
      function(event,session){

        if(session){

          document.getElementById(
            "accountBtn"
          ).textContent="Account";

        }

      }
    );

}


loadProducts();
/* ================= ADMIN PANEL ================= */

async function checkAdmin() {
  if (!supabaseClient) return false;

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return false;

  const { data } = await supabaseClient
    .from("admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  return !!data;
}

async function openAdminPanel() {
  const isAdmin = await checkAdmin();

  if (!isAdmin) {
    alert("Admin access only.");
    return;
  }

  document.getElementById("adminPanel").classList.add("open");
  await loadAdminProducts();
}

function closeAdminPanel() {
  document.getElementById("adminPanel").classList.remove("open");
}

async function addAdminProduct() {
  const title = document.getElementById("adminTitle").value.trim();
  const description = document.getElementById("adminDescription").value.trim();
  const price = Number(document.getElementById("adminPrice").value);
  const category = document.getElementById("adminCategory").value;
  const condition = document.getElementById("adminCondition").value;
  const image_url = document.getElementById("adminImage").value.trim();

  if (!title || !price) {
    alert("Title aur price required hai.");
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("Please login first.");
    return;
  }

  const { error } = await supabaseClient
    .from("products")
    .insert({
      seller_id: user.id,
      title,
      description,
      price,
      category,
      condition,
      image_url,
      status: "active"
    });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Product added successfully!");

  document.getElementById("adminTitle").value = "";
  document.getElementById("adminDescription").value = "";
  document.getElementById("adminPrice").value = "";
  document.getElementById("adminImage").value = "";

  await loadAdminProducts();
  await loadProducts();
}

async function loadAdminProducts() {
  const box = document.getElementById("adminProducts");

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.textContent = error.message;
    return;
  }

  box.innerHTML = "";

  data.forEach(function(product) {

    const item = document.createElement("div");
    item.className = "admin-product";

    const name = document.createElement("b");
    name.textContent = product.title;

    const info = document.createElement("div");
    info.textContent =
      "₹" + product.price + " • " +
      product.category + " • " +
      product.condition;

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.onclick = function() {
      editAdminProduct(product);
    };

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = function() {
      deleteAdminProduct(product.id);
    };

    item.appendChild(name);
    item.appendChild(info);
    item.appendChild(edit);
    item.appendChild(del);

    box.appendChild(item);
  });
}

async function editAdminProduct(product) {

  const title = prompt("Product name:", product.title);
  if (title === null) return;

  const price = prompt("Price:", product.price);
  if (price === null) return;

  const category = prompt("Category:", product.category);
  if (category === null) return;

  const condition = prompt("Condition:", product.condition);
  if (condition === null) return;

  const { error } = await supabaseClient
    .from("products")
    .update({
      title: title,
      price: Number(price),
      category: category,
      condition: condition
    })
    .eq("id", product.id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Product updated!");
  await loadAdminProducts();
  await loadProducts();
}

async function deleteAdminProduct(id) {

  if (!confirm("Is product ko delete karna hai?")) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Product deleted!");
  await loadAdminProducts();
  await loadProducts();
}

async function loadAdminOrders(){

  const box =
    document.getElementById("adminOrders");

  if(!box) return;

  box.innerHTML =
    "<p>Loading orders...</p>";

  const result =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(result.error){

    box.innerHTML =
      "<p>Unable to load orders.</p>";

    console.error(result.error);

    return;
  }

  const orders = result.data || [];

  if(!orders.length){

    box.innerHTML =
      "<p>No orders found.</p>";

    return;
  }

  box.innerHTML = orders.map(order => {

    const date =
      order.created_at
        ? new Date(order.created_at)
            .toLocaleString()
        : "";

    return `
      <div class="adminOrderCard">

        <h3>
          🧾 Order
          ${String(order.id).slice(0,8)}
        </h3>

        <p>
          <b>Customer:</b>
          ${order.customer_name || "-"}
        </p>

        <p>
          <b>Mobile:</b>
          ${order.customer_phone || "-"}
        </p>

        <p>
          <b>Address:</b>
          ${order.address || "-"}
        </p>

        <p>
          <b>City:</b>
          ${order.city || "-"}
        </p>

        <p>
          <b>PIN:</b>
          ${order.pin_code || "-"}
        </p>

        <p>
          <b>Total:</b>
          ₹${Number(order.total_amount || 0).toLocaleString("en-IN")}
        </p>

        <p>
          <b>Order Status:</b>
          ${order.status || "pending"}
        </p>

        <p>
          <b>Payment:</b>
          ${order.payment_status || "pending"}
        </p>

        <p>
          <b>Date:</b>
          ${date}
        </p>

      </div>
    `;

  }).join("");

}
