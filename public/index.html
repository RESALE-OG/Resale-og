<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESALE OG</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071018;
  color:#fff;
}
button{cursor:pointer}

.top{
  background:#06131d;
  border-bottom:1px solid #183746;
  padding:10px;
  text-align:center;
  color:#62e6ff;
  font-size:13px;
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#08151eee;
  border-bottom:1px solid #1d4050;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}
.logo span{color:#22d9ff}

.navbtn{
  background:#102633;
  color:#fff;
  border:1px solid #2b5262;
  padding:9px 12px;
  border-radius:10px;
  margin-left:5px;
}

.hero{
  text-align:center;
  padding:55px 20px;
  background:radial-gradient(circle at top,#0c4154,transparent 60%);
}

.hero h1{
  font-size:clamp(38px,9vw,65px);
  margin:5px 0;
}

.hero span{color:#20d8ff}

.hero p{
  color:#9eb4be;
  margin-bottom:25px;
}

.primary{
  background:#20d8ff;
  color:#001017;
  font-weight:bold;
  padding:12px 20px;
  border:0;
  border-radius:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:20px;
}

.filter{
  white-space:nowrap;
  background:#10232e;
  color:#d9f8ff;
  border:1px solid #294a58;
  padding:9px 14px;
  border-radius:20px;
}

.filter.active{
  background:#20d8ff;
  color:#001017;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:15px;
}

.card{
  background:#0c1c26;
  border:1px solid #1e3e4c;
  border-radius:16px;
  overflow:hidden;
}

.image{
  height:165px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#153949,#081018);
  color:#5c8290;
  font-size:13px;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{padding:13px}

.name{
  font-weight:bold;
  margin-bottom:7px;
}

.category{
  color:#8099a5;
  font-size:12px;
}

.price{
  color:#5ee5ff;
  font-size:19px;
  font-weight:bold;
  margin-top:7px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.actions button{
  flex:1;
  padding:9px;
  border-radius:9px;
  border:0;
  background:#16313d;
  color:white;
}

.actions .buy{
  background:#20d8ff;
  color:#001017;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:50px;
  color:#91a9b3;
}

footer{
  text-align:center;
  padding:40px 15px;
  color:#718893;
}

.drawer,
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
}

.drawer.open,
.modal.open{
  display:block;
}

.shade{
  position:absolute;
  inset:0;
  background:#000b;
}

.panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(420px,92vw);
  background:#091721;
  border-left:1px solid #2a5261;
  padding:20px;
  overflow:auto;
}

.modalbox{
  position:relative;
  z-index:2;
  width:min(420px,92vw);
  margin:12vh auto;
  background:#0b1c27;
  border:1px solid #2a5261;
  border-radius:18px;
  padding:22px;
}

.close{
  float:right;
  background:none;
  color:white;
  border:0;
  font-size:25px;
}

.input{
  width:100%;
  padding:12px;
  margin:7px 0;
  background:#071018;
  color:white;
  border:1px solid #294b59;
  border-radius:10px;
}

.full{
  width:100%;
  margin-top:9px;
}

.cartrow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #1b3743;
}

.remove{
  background:#142e39;
  color:white;
  border:0;
  border-radius:8px;
  padding:7px;
}

.total{
  color:#5ee5ff;
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.toast{
  display:none;
  position:fixed;
  z-index:100;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#20d8ff;
  color:#001017;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
}

@media(max-width:500px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .image{
    height:145px;
  }
}
</style>
</head>

<body>

<div class="top">
🚚 RESALE OG — Buy Better. Resale Smarter.
</div>

<nav>
  <div class="logo">
    RESALE <span>OG</span>
  </div>

  <div>
    <button class="navbtn" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>

    <button class="navbtn" onclick="openLogin()" id="accountBtn">
      Login
    </button>
  </div>
</nav>

<section class="hero">
  <h1>RESALE <span>OG</span></h1>

  <p>
    Quality pre-owned products. Simple shopping.
  </p>

  <button class="primary"
    onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
    Shop Now
  </button>
</section>

<main class="container" id="shop">

  <div class="filters">

    <button class="filter active"
      onclick="filterProducts('All',this)">
      All
    </button>

    <button class="filter"
      onclick="filterProducts('Fashion',this)">
      Fashion
    </button>

    <button class="filter"
      onclick="filterProducts('Electronics',this)">
      Electronics
    </button>

    <button class="filter"
      onclick="filterProducts('Shoes',this)">
      Shoes
    </button>

    <button class="filter"
      onclick="filterProducts('Accessories',this)">
      Accessories
    </button>

  </div>

  <div id="products" class="products"></div>

</main>

<footer>
  RESALE OG<br>
  Buyer-only resale store<br>
  resaleorigins@gmail.com
</footer>


<!-- CART -->

<div id="cartDrawer" class="drawer">

  <div class="shade" onclick="closeCart()"></div>

  <div class="panel">

    <button class="close" onclick="closeCart()">×</button>

    <h2>Your Cart 🛒</h2>

    <div id="cartList"></div>

    <div class="total">
      Total: ₹<span id="cartTotal">0</span>
    </div>

    <button class="primary full" onclick="checkout()">
      Checkout
    </button>

  </div>
</div>


<!-- LOGIN -->

<div id="loginModal" class="modal">

  <div class="shade" onclick="closeLogin()"></div>

  <div class="modalbox">

    <button class="close" onclick="closeLogin()">×</button>

    <h2 id="authTitle">Login</h2>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email">

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password">

    <button
      class="primary full"
      onclick="login()"
      id="loginButton">
      Continue
    </button>

    <button
      class="navbtn full"
      onclick="toggleSignup()">
      Create account
    </button>

    <p id="authMsg"></p>

  </div>
</div>


<div id="toast" class="toast"></div>


<script>

const demoProducts = [

 {
  id:"demo1",
  name:"Premium Hoodie",
  price:899,
  category:"Fashion"
 },

 {
  id:"demo2",
  name:"Wireless Headphones",
  price:1299,
  category:"Electronics"
 },

 {
  id:"demo3",
  name:"Classic Sneakers",
  price:1599,
  category:"Shoes"
 },

 {
  id:"demo4",
  name:"Smart Watch",
  price:1799,
  category:"Accessories"
 },

 {
  id:"demo5",
  name:"Denim Jacket",
  price:999,
  category:"Fashion"
 },

 {
  id:"demo6",
  name:"Bluetooth Speaker",
  price:799,
  category:"Electronics"
 }

];


let products=[...demoProducts];

let cart=JSON.parse(
  localStorage.getItem("resale_cart") || "[]"
);

let currentCategory="All";

let supabaseClient=null;

let signupMode=false;


/* SUPABASE */

try{

  if(
    window.supabase &&
    window.SUPABASE_URL &&
    window.SUPABASE_ANON_KEY &&
    !String(window.SUPABASE_ANON_KEY)
      .includes("PASTE_YOUR")
  ){

    supabaseClient=
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

  }

}catch(error){

  console.log(
    "Supabase optional:",
    error
  );

}


/* HELPERS */

function money(value){

  return Number(value || 0)
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char];

    });

}


function toast(message){

  const box=
    document.getElementById("toast");

  box.textContent=message;

  box.style.display="block";

  setTimeout(function(){

    box.style.display="none";

  },1800);

}


/* PRODUCTS */

function renderProducts(){

  const list=
    currentCategory==="All"
      ? products
      : products.filter(
          p=>p.category===currentCategory
        );


  const box=
    document.getElementById("products");


  if(!list.length){

    box.innerHTML=
      '<div class="empty">No products found.</div>';

    return;

  }


  box.innerHTML=

    list.map(function(p){

      return `

      <article class="card">

        <div class="image">

          ${
            p.image_url
            ?
            `<img src="${escapeHtml(p.image_url)}">`
            :
            "RESALE OG"
          }

        </div>

        <div class="info">

          <div class="name">
           ${escapeHtml(p.name || p.title || "Product")}
          </div>

          <div class="category">
            ${escapeHtml(p.category || "Resale")}
          </div>

          <div class="price">
            ₹${money(p.price)}
          </div>

          <div class="actions">

            <button
              onclick="addCart('${p.id}')">
              Add
            </button>

            <button
              class="buy"
              onclick="buyNow('${p.id}')">
              Buy
            </button>

          </div>

        </div>

      </article>

      `;

    }).join("");

}


function filterProducts(category,button){

  currentCategory=category;

  document
    .querySelectorAll(".filter")
    .forEach(function(btn){

      btn.classList.remove("active");

    });

  button.classList.add("active");

  renderProducts();

}


/* CART */

function findProduct(id){

  return products.find(
    p=>String(p.id)===String(id)
  );

}


function addCart(id){

  const product=findProduct(id);

  if(!product) return;

  const existing=
    cart.find(
      item=>String(item.id)===String(id)
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  saveCart();

  toast("Added to cart 🛒");

}


function buyNow(id){

  addCart(id);

  openCart();

}


function saveCart(){

  localStorage.setItem(
    "resale_cart",
    JSON.stringify(cart)
  );

  updateCart();

}


function removeCart(id){

  cart=
    cart.filter(
      item=>String(item.id)!==String(id)
    );

  saveCart();

}


function updateCart(){

  const safeCart = Array.isArray(cart)
    ? cart.map(item => ({
        ...item,
        qty: Number(item.qty) || 0,
        price: Number(item.price) || 0
      })).filter(item => item.qty > 0)
    : [];

  cart = safeCart;

  document.getElementById("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.qty, 0);

  const list = document.getElementById("cartList");

  if(cart.length){

    list.innerHTML = cart.map(function(item){

      const itemName = item.name || item.title || "Product";

      return `
        <div class="cartrow">
          <div>
            <b>${escapeHtml(itemName)}</b>
            <br>
            <small>₹${money(item.price)} × ${item.qty}</small>
          </div>

          <button
            class="remove"
            onclick="removeCart('${item.id}')">
            Remove
          </button>
        </div>
      `;

    }).join("");

  } else {

    list.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

  }

  const total = cart.reduce(
    (sum, item) =>
      sum + (Number(item.price) || 0) * (Number(item.qty) || 0),
    0
  );

  document.getElementById("cartTotal").textContent =
    money(total);
}
  
  
function openCart(){

  document
    .getElementById("cartDrawer")
    .classList.add("open");

  updateCart();

}


function closeCart(){

  document
    .getElementById("cartDrawer")
    .classList.remove("open");

}


/* LOGIN */

function openLogin(){

  document
    .getElementById("loginModal")
    .classList.add("open");

}


function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("open");

}


function toggleSignup(){

  signupMode=!signupMode;

  document.getElementById("authTitle")
    .textContent=
      signupMode
      ? "Create account"
      : "Login";


  document.getElementById("loginButton")
    .textContent=
      signupMode
      ? "Create account"
      : "Continue";


  document.getElementById("authMsg")
    .textContent="";

}


async function login(){

  const email=
    document.getElementById("email")
      .value.trim();

  const password=
    document.getElementById("password")
      .value;


  if(!email || !password){

    document.getElementById("authMsg")
      .textContent=
        "Email and password required.";

    return;

  }


  if(!supabaseClient){

    document.getElementById("authMsg")
      .textContent=
        "Supabase connection is not ready yet.";

    return;

  }


  let result;


  if(signupMode){

    result=
      await supabaseClient.auth.signUp({
        email:email,
        password:password
      });

  }else{

    result=
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

  }


  if(result.error){

    document.getElementById("authMsg")
      .textContent=
        result.error.message;

  }else{

    document.getElementById("authMsg")
      .textContent=
        signupMode
        ?
        "Account created. Check your email if confirmation is enabled."
        :
        "Login successful.";

    if(!signupMode){

      document.getElementById("accountBtn")
        .textContent="Account";

      setTimeout(
        closeLogin,
        700
      );

    }

  }

}


/* CHECKOUT */

async function checkout(){

  if(!cart.length){

    toast("Cart is empty");

    return;

  }


  if(!supabaseClient){

    openLogin();

    document.getElementById("authMsg")
      .textContent=
        "Please connect Supabase first.";

    return;

  }


  const result=
    await supabaseClient.auth.getSession();


  if(!result.data.session){

    openLogin();

    return;

  }


  toast(
    "Checkout ready — payment next."
  );

}


/* LOAD PRODUCTS */

async function loadProducts(){

  if(!supabaseClient){

    renderProducts();

    updateCart();

    return;

  }


  try{

    const result=
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );


    if(
      !result.error &&
      result.data &&
      result.data.length
    ){

      products=result.data;

    }

  }catch(error){

    console.log(error);

  }


  renderProducts();

  updateCart();

}


/* AUTH STATE */

if(supabaseClient){

  supabaseClient.auth
    .onAuthStateChange(
      function(event,session){

        if(session){

          document.getElementById(
            "accountBtn"
          ).textContent="Account";

        }

      }
    );

}


loadProducts();

</script>

</body>
</html>
